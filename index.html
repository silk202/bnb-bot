<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#131416" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FlashBolt" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <!-- Anti-clone hardening: the app is access-gated and must never be
       indexed, archived, or re-served by crawlers / cloners. All real
       functionality lives server-side in the Convex deployment, so the
       static bundle contains no secrets and no backend logic. -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta name="description" content="FlashBolt — a dual-chain flash-loan arbitrage terminal for BNB Chain and Solana. Scan live multi-DEX spreads with real market data, copy Telegram signals, run 24/7 engines, and execute real on-chain routes from your own wallet." />
  <title>FlashBolt — BNB Chain & Solana Flash-Loan Arbitrage Terminal</title>
  <style>
    /* Pre-React boot loader — paints on the very first frame so the preview
       is never a bare black screen while modules load. Uses the app's dark
       charcoal palette so there is no flash of the wrong theme. */
    #fb-boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: oklch(0.148 0.003 70);
      color: oklch(0.965 0.006 85);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      z-index: 1;
    }
    #fb-boot .fb-boot-inner { text-align: center; }
    #fb-boot .fb-logo {
      width: 64px; height: 64px; border-radius: 9999px; margin: 0 auto 12px;
      box-shadow: 0 0 22px -6px oklch(0.795 0.155 72 / 0.6), 0 0 64px -16px oklch(0.795 0.155 72 / 0.35);
    }
    #fb-boot .fb-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
    #fb-boot .fb-title span { color: oklch(0.795 0.155 72); }
    #fb-boot .fb-sub {
      margin-top: 6px; font-size: 10px; font-weight: 700;
      letter-spacing: 0.24em; text-transform: uppercase;
      color: oklch(0.66 0.012 70);
    }
    #fb-boot .fb-bar {
      width: 180px; height: 3px; border-radius: 9999px; overflow: hidden;
      background: oklch(0.22 0.005 70); margin: 18px auto 0; position: relative;
    }
    #fb-boot .fb-bar::after {
      content: ""; position: absolute; inset: 0; width: 40%;
      background: oklch(0.795 0.155 72); border-radius: 9999px;
      animation: fb-boot-slide 1.1s ease-in-out infinite;
    }
    @keyframes fb-boot-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    /* Crash watchdog — takes over only when React fails to mount. */
    #fb-boot-error {
      display: none; position: fixed; inset: 0; z-index: 2;
      align-items: flex-start; justify-content: center;
      padding: 96px 24px 48px; /* top padding clears the platform's "Click to test" pill */
      overflow-y: auto;
      background: oklch(0.148 0.003 70); color: oklch(0.965 0.006 85);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #fb-boot-error .fb-err-inner {
      max-width: 640px; width: 100%; text-align: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #fb-boot-error h1 { font-size: 1.05rem; font-weight: 700; margin: 0 0 8px; }
    #fb-boot-error .fb-err-msg {
      text-align: left; font-size: 11px; line-height: 1.5; white-space: pre-wrap;
      word-break: break-word; max-height: 45vh; overflow: auto;
      border: 1px solid oklch(1 0 0 / 12%); border-radius: 10px;
      padding: 10px 12px; background: oklch(0.185 0.005 70);
      color: oklch(0.9 0.01 70);
    }
    #fb-boot-error button {
      margin-top: 16px; border: 0; cursor: pointer;
      background: oklch(0.795 0.155 72); color: oklch(0.17 0.03 70);
      font-weight: 700; font-size: 13px; padding: 10px 22px; border-radius: 9999px;
    }
  </style>
</head>


<body>
  <!-- Boot loader: shown instantly, removed by the app once React mounts. -->
  <div id="fb-boot" aria-hidden="true">
    <div class="fb-boot-inner">
      <img class="fb-logo" src="/logo.svg" alt="" />
      <div class="fb-title">Flash<span>Bolt</span></div>
      <div class="fb-sub">Loading terminal…</div>
      <div class="fb-bar"></div>
    </div>
  </div>

  <!-- Crash watchdog: if React never mounts, replace the black screen with
       the actual error + a reload button instead of leaving the user with
       an unexplained blank page. -->
  <div id="fb-boot-error" role="alert">
    <div class="fb-err-inner">
      <h1>Preview failed to start</h1>
      <div class="fb-err-msg" id="fb-boot-error-msg">Waiting for diagnostics…</div>
      <button type="button" id="fb-boot-reload">Reload preview</button>
    </div>
  </div>

  <div id="root"></div>

  <script>
    (function () {
      "use strict";
      // Bound here rather than with an `onclick=` attribute: the deployed page
      // carries a nonce-based Content-Security-Policy (sites/worker.js), which
      // blocks inline event handlers.
      var reloadBtn = document.getElementById("fb-boot-reload");
      if (reloadBtn) {
        reloadBtn.addEventListener("click", function () { window.location.reload(); });
      }

      var errMsg = document.getElementById("fb-boot-error-msg");
      var errBox = document.getElementById("fb-boot-error");
      var booted = false;
      var lines = [];

      function disarm() {
        if (booted) return;
        booted = true;
        var boot = document.getElementById("fb-boot");
        if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        if (errBox) errBox.style.display = "none";
        // Successful boot: clear the auto-recovery budget so a future real
        // failure always gets the full retry allowance again.
        try { sessionStorage.removeItem(RELOAD_MARKER); } catch (e) {}
      }

      function show(message) {
        if (booted) return; // React is up — the boundary handles the rest.
        lines.push(message);
        if (errMsg) errMsg.textContent = lines.join("\n\n");
        if (errBox) {
          errBox.style.display = "flex";
          var boot = document.getElementById("fb-boot");
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }
      }

      // ── Auto-recovery: two phases, no dead ends. ──
      //
      // Phase 1 (fast): right after a sandbox restart, the FIRST page load
      // can fail mid-module — Vite is still pre-bundling dependencies. A few
      // quick reloads (1.5s apart) ride that out.
      //
      // Phase 2 (patient): when the platform's managed dev session is down
      // entirely (sandbox generation change / session recycle), every request
      // fails until the platform relaunches it — which can take a minute or
      // more. Instead of dead-ending after 3 fast tries, the page keeps
      // retrying every 15s with a live countdown, and boots itself the moment
      // the server returns.
      //
      // Guards: consecutive-attempt tracking in sessionStorage (per tab), a
      // hard 8-minute wall on total auto-recovery so it can never loop
      // forever, and the budget clears itself on any successful boot.
      var MAX_FAST_RELOADS = 3;   // quick retries (1.5s apart) for cold starts
      var MAX_SLOW_RELOADS = 26;  // patient retries (15s apart ≈ 6.5 min) for dead sessions
      var SLOW_INTERVAL_MS = 15000;
      var AUTO_RELOAD_WALL_MS = 480000; // absolute stop: 8 minutes of trying
      var RELOAD_MARKER = "flashbolt.boot.autoreload";
      var attempts = { n: 0, t: 0, s: 0, f: 0 };
      try {
        var stored = JSON.parse(sessionStorage.getItem(RELOAD_MARKER) || "");
        if (stored && typeof stored === "object") attempts = stored;
      } catch (e) {
        attempts = { n: 0, t: 0, s: 0, f: 0 };
      }

      // A fresh navigation (user typed the URL, or clicked a link from
      // outside) resets the fast budget — only consecutive auto-reloads count.
      if (!attempts.t || Date.now() - attempts.t > 60000) attempts.n = 0;
      if (!attempts.f) attempts.f = Date.now();

      // One reload scheduled per page load — the error listener and the
      // mount-timeout must never stack two reload timers.
      var reloadScheduled = false;

      function persistAttempts() {
        try { sessionStorage.setItem(RELOAD_MARKER, JSON.stringify(attempts)); } catch (e) {}
      }

      function takeOverPane(text) {
        if (errMsg) errMsg.textContent = text;
        if (errBox) errBox.style.display = "flex";
        var splash = document.getElementById("fb-boot");
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
      }

      function scheduleAutoReload(reason) {
        if (booted || reloadScheduled) return;
        reloadScheduled = true;
        var now = Date.now();

        // Hard wall — never auto-reload for more than 8 minutes in one tab.
        if (now - attempts.f > AUTO_RELOAD_WALL_MS) {
          takeOverPane(
            reason + "\n\n" +
            "Auto-recovery stopped after " + Math.round((now - attempts.f) / 1000) + "s of trying.\n" +
            "The preview server is still not answering.\n" +
            "Click Reload — or use Open in new tab — once the platform shows the session as running."
          );
          return;
        }

        // Phase 1: fast retries for the module cold-start race.
        if (attempts.n < MAX_FAST_RELOADS) {
          attempts.n += 1;
          attempts.t = now;
          persistAttempts();
          takeOverPane(reason + "\n\nRestarting preview… (attempt " + attempts.n + " of " + MAX_FAST_RELOADS + " quick)");
          window.setTimeout(function () { window.location.reload(); }, 1500);
          return;
        }

        // Phase 2: patient retries while the platform relaunches the session.
        attempts.s = (attempts.s || 0) + 1;
        attempts.t = now;
        persistAttempts();
        if (attempts.s > MAX_SLOW_RELOADS) {
          takeOverPane(
            reason + "\n\n" +
            "Auto-recovery tried " + attempts.n + " quick + " + (attempts.s - 1) + " patient retries without success.\n" +
            "The preview server is still down. Click Reload once the session is running."
          );
          return;
        }
        takeOverPane(
          reason + "\n\n" +
          "Waiting for the preview server — retrying every 15 seconds.\n" +
          "Attempt " + attempts.s + " of " + MAX_SLOW_RELOADS + " (" + (MAX_SLOW_RELOADS - attempts.s + 1) + " left).\n" +
          "If the server is warming up (one-time dependency optimization after\n" +
          "a restart), this finishes by itself — the app loads automatically,\n" +
          "no action needed."
        );
        window.setTimeout(function () { window.location.reload(); }, SLOW_INTERVAL_MS);
      }

      // Cold-start signature: a module/dep resource failed to load, or a
      // dynamic import was rejected. Both recover with one reload.
      // NOTE: an error with an EMPTY message is always a load failure — real
      // runtime exceptions always carry a message — so empty-message events
      // (e.g. /@vite/client or index.html?import failing mid-cold-start)
      // also route to auto-recovery instead of a dead diagnostic.
      window.addEventListener("error", function (e) {
        if (booted) return;
        var target = e && e.target;
        var hasMessage = !!(e && e.message);
        var isLoadFailure = !hasMessage || (target && (target.src || target.href) && !hasMessage);
        if (isLoadFailure) {
          e.stopPropagation();
          var src = (target && (target.src || target.href)) || (e && e.filename) || "";
          scheduleAutoReload("A module failed to load during startup (cold-start race).\nSource: " + src);
          return;
        }
        show("Error: " + e.message + (e.filename ? "\nSource: " + e.filename : ""));
      }, true);

      window.addEventListener("unhandledrejection", function (e) {
        if (booted) return;
        var reason = e && e.reason;
        var msg = reason && reason.message ? reason.message : String(reason);
        // "Failed to fetch dynamically imported module" is the classic
        // mid-load cold-start failure — auto-recover from it.
        if (/Failed to fetch|error loading dynamically imported|Importing a module script failed/i.test(msg)) {
          e.preventDefault();
          scheduleAutoReload("A module request failed during startup (cold-start race).\n" + msg);
          return;
        }
        show("Rejection: " + msg);
      });

      // Primary disarm path — the moment React renders ANYTHING into #root,
      // the splash comes off. No reliance on the app calling a signal, so a
      // successful boot can never leave the splash stuck over the UI.
      var root = document.getElementById("root");
      if (root && typeof MutationObserver !== "undefined") {
        new MutationObserver(function () {
          if (root.firstChild) {
            disarm();
            this.disconnect();
          }
        }).observe(root, { childList: true });
      }

      // Backup disarm path — the app also calls this right after mount.
      window.__flashboltBootOk = disarm;

      // Live status on the splash during long cold starts (Vite re-transforms
      // ~3,500 modules after a sandbox restart), then a diagnostic takeover
      // if React truly never mounts.
      var sub = document.querySelector("#fb-boot .fb-sub");
      var waited = 0;
      var ticker = window.setInterval(function () {
        if (booted) {
          window.clearInterval(ticker);
          return;
        }
        waited += 1;
        if (sub && waited % 5 === 0 && !warmupNoted) {
          sub.textContent = "Still loading\u2026 " + waited + "s";
        }
      }, 1000);

      // Staged mount watcher — distinguishes "still loading" from "hung":
      //
      // 1. First 30s: normal boot expectation — the splash ticker shows
      //    progress, no action.
      // 2. Past 30s while the page is STILL loading work (document parsing,
      //    or any recent resource request in flight per the Performance API
      //    — the one-time dependency-optimization warmup after a repair or
      //    first cold start): NEVER reload here — a reload restarts the very
      //    pass we are waiting on. Update the splash text and keep waiting,
      //    up to a 150s patience wall.
      // 3. Past 30s with nothing in flight and no mount: genuine hang →
      //    route into the bounded auto-reload budget.
      var MOUNT_GRACE_MS = 30000;
      var WARMUP_MAX_MS = 150000;
      var bootAt = Date.now();
      var warmupNoted = false;

      // True while any recent resource request is still in flight (its
      // responseEnd is 0 until it completes). This is what distinguishes a
      // busy one-time warmup from a genuine boot hang — readyState alone
      // misses in-flight module fetches after parsing finishes.
      function networkBusy() {
        try {
          var entries = performance.getEntriesByType("resource");
          for (var i = entries.length - 1; i >= 0 && i >= entries.length - 40; i--) {
            if (entries[i] && !entries[i].responseEnd) return true;
          }
        } catch (err) { /* performance API unavailable — treat as idle */ }
        return false;
      }

      var mountWatch = window.setInterval(function () {
        if (booted) {
          window.clearInterval(mountWatch);
          return;
        }
        var elapsed = Date.now() - bootAt;
        if (elapsed < MOUNT_GRACE_MS) return;
        if (document.readyState === "loading" || networkBusy()) {
          if (!warmupNoted) {
            warmupNoted = true;
            if (sub) sub.textContent = "First-load optimization — one time only\u2026";
          }
          if (elapsed > WARMUP_MAX_MS) {
            window.clearInterval(mountWatch);
            scheduleAutoReload(
              "First load is still optimizing after " + Math.round(elapsed / 1000) + " seconds.\n\n" +
              "This one-time warmup is taking unusually long — restarting it.\n" +
              "location: " + window.location.href
            );
          }
          return;
        }
        // Nothing in flight, no mount, no captured error → genuine hang.
        window.clearInterval(mountWatch);
        scheduleAutoReload(
          "React did not mount within " + Math.round(elapsed / 1000) + " seconds.\n\n" +
          "The page finished loading but the app did not start — this is a\n" +
          "boot hang, not a slow warmup. Auto-recovery will retry.\n\n" +
          "location: " + window.location.href
        );
      }, 1000);
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
