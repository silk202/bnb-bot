<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="orb" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#ffcf7a"/>
      <stop offset="45%" stop-color="#ff9a2e"/>
      <stop offset="100%" stop-color="#e05a00"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcf7a"/>
      <stop offset="100%" stop-color="#e05a00"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- orbital ring -->
  <ellipse cx="256" cy="256" rx="196" ry="74" fill="none" stroke="url(#ring)" stroke-width="14" opacity="0.9" transform="rotate(-24 256 256)" filter="url(#glow)"/>
  <ellipse cx="256" cy="256" rx="196" ry="74" fill="none" stroke="#ffcf7a" stroke-width="5" opacity="0.5" transform="rotate(-24 256 256)"/>

  <!-- core orb -->
  <circle cx="256" cy="258" r="128" fill="url(#orb)"/>
  <circle cx="256" cy="258" r="128" fill="none" stroke="#ffcf7a" stroke-width="6" opacity="0.7"/>

  <!-- lightning bolt -->
  <path d="M292 150 L196 280 L252 280 L224 368 L326 232 L268 232 Z" fill="#14100a"/>
  <path d="M282 162 L210 272 L258 272 L234 344 L314 240 L266 240 Z" fill="#ffd98f"/>
</svg>
