# One push updates every surface concurrently:
#   1. This workflow verifies the whole app (typecheck, tests, production
#      build — which rebuilds the overlay artifacts) and uploads the overlay
#      zips/userscript as a downloadable artifact.
#   2. The Convex backend deploys automatically from the CONVEX_DEPLOY_KEY
#      environment secret (Settings → Environments → CONVEX_DEPLOY_KEY), which
#      the `deploy-convex` job declares as its environment.
#   3. The `solana-program` job builds the Anchor program (Solana SBF), proves
#      the tracked IDL still matches the source, runs clippy and the LiteSVM +
#      IDL conformance tests. It never deploys and never needs a keypair.
#   4. Vercel / Netlify / Cloudflare Pages / Render each auto-build from the
#      same push via their native git integration — their zero-config build
#      settings live in vercel.json / netlify.toml / wrangler.toml /
#      render.yaml (all run `bun run build`, which includes the overlay
#      rebuild). No workflow needed for those; connect the repo once.
#
# NOTE: `bun run lint` is run as a NON-BLOCKING step below (continue-on-error)
# because the repo carries pre-existing lint findings; typecheck + tests are
# the hard gates.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (non-blocking — pre-existing findings)
        run: bun run lint
        continue-on-error: true

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # `bun run build` = tsc -b && bun run overlay && vite build — the
      # overlay artifacts (extension zips + userscript served by the app's
      # Downloads page) are rebuilt from the same version consts on every
      # push, so they can never drift from the app.
      - name: Production build
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

      - name: Upload overlay artifacts (downloads surface)
        uses: actions/upload-artifact@v4
        with:
          name: overlay-${{ github.sha }}
          path: |
            public/overlay/*.zip
            public/overlay/*.user.js
          if-no-files-found: error
          retention-days: 30

  # The on-chain program is a separate toolchain (Rust + Solana SBF + Anchor)
  # and a separate failure domain, so it gets its own job: an app regression
  # must not hide a program regression, or the other way round.
  #
  # Pinned deliberately:
  #   * Solana CLI from the `stable` channel — the `v4.4.1` tag currently
  #     installs an SBF v1 toolchain whose bundled Cargo is 1.79, which cannot
  #     parse the `edition2024` manifests in the current dependency tree
  #     (`failed to parse manifest ... cpufeatures-0.3.1`). The channel build
  #     ships cargo-build-sbf 4.5.0.
  #   * platform-tools v1.57 (Rust 1.95) — pinned on its own, so the SBF
  #     compiler cannot drift with the channel.
  #   * The SBF v1 arch is required because LiteSVM 0.7 rejects the Agave
  #     default (v3) with `Instruction(InvalidAccountData)`. Its spelling is
  #     not stable across cargo-build-sbf builds (`sbfv1` on the runner,
  #     `v1` on the channel build used locally), so the build step reads the
  #     accepted name from the binary's own help output. Dropping this pin is
  #     a dependency migration, not a flag flip: SBPFv3 needs litesvm >= 0.18
  #     (solana-* 4.x, MSRV 1.97.1), while the harness is anchor-lang 0.31.1 /
  #     solana-sdk 2.2 / litesvm 0.7. Tracked as its own round.
  #   * Anchor 0.31.1 — matches anchor-lang in the program's Cargo.toml. Its
  #     prebuilt binary needs GLIBC >= 2.38, which is why this job runs on
  #     ubuntu-24.04 rather than relying on `ubuntu-latest`.
  #
  # Nothing here signs or deploys: the program keypair and a funded devnet
  # deployer do not exist on a runner, which is exactly what the preflight's
  # CI mode treats as expected rather than as a failure.
  solana-program:
    name: Solana program (build, IDL, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and the SBF build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            solana/target
          key: solana-${{ runner.os }}-sbf-v1.57-${{ hashFiles('solana/Cargo.lock') }}

      - name: Install Rust stable with clippy
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Install Solana CLI (stable channel)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # The wrapper bundled with the CLI only carries the SBF v1 sysroot for
      # its own platform-tools default (Cargo 1.79), which cannot parse the
      # edition2024 manifests in today's dependency tree. Its warning says to
      # install the current wrapper; that wrapper is built against Rust 1.95
      # and matches platform-tools v1.57, which is installed next and pinned
      # for the build.
      - name: Prefer the crates.io cargo-build-sbf over the CLI's copy
        # The crate's build script refuses to install while the CLI's copy
        # shadows it on PATH; GITHUB_PATH entries are prepended, so this makes
        # ~/.cargo/bin win for every later step.
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-build-sbf (matches platform-tools v1.57)
        run: cargo install cargo-build-sbf --locked

      - name: Install SBF platform-tools v1.57
        # cargo-build-sbf resolves the release through the GitHub API, which
        # rate-limits runner IPs and failed with "Failed to parse Github
        # response: error decoding response body" on every retry. The release
        # asset is public and the version is pinned, so fetch that directly
        # into the cache layout the wrapper reads. A warm cache (see the cache
        # step above) skips this entirely.
        run: |
          TOOLS="$HOME/.cache/solana/v1.57/platform-tools"
          if [ -f "$TOOLS/version.md" ]; then
            echo "platform-tools v1.57 already cached"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/anza-xyz/platform-tools/releases/download/v1.57/platform-tools-linux-x86_64.tar.bz2" \
            -o /tmp/platform-tools.tar.bz2
          rm -rf /tmp/pt && mkdir -p /tmp/pt
          tar -xjf /tmp/platform-tools.tar.bz2 -C /tmp/pt
          # The archive root may or may not be wrapped in a directory; find the
          # one holding version.md and install its contents at the expected path.
          SRC="$(dirname "$(find /tmp/pt -name version.md -print -quit)")"
          test -f "$SRC/version.md" || { echo "platform-tools archive has no version.md"; exit 1; }
          mkdir -p "$TOOLS"
          cp -a "$SRC/." "$TOOLS/"
          test -f "$TOOLS/version.md"

      - name: Install Anchor CLI 0.31.1
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --locked --force
          avm install 0.31.1
          avm use 0.31.1
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      # A channel swap once put the SBF compiler on a platform-tools whose
      # Cargo 1.79 cannot parse the edition2024 manifests in today's dependency
      # tree. Printing the versions made that a 20-minute failure inside the
      # build; the pinned versions are asserted here instead, at the top.
      - name: Assert the pinned toolchain
        run: |
          rustc --version && cargo --version
          OUT="$("$HOME/.cargo/bin/cargo-build-sbf" --version)"
          echo "$OUT"
          which cargo-build-sbf && cargo-build-sbf --version | head -1
          solana --version && anchor --version

          if [ "$(command -v cargo-build-sbf)" != "$HOME/.cargo/bin/cargo-build-sbf" ]; then
            echo "::error::cargo-build-sbf on PATH is not the crates.io build in ~/.cargo/bin"
            exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -qF "platform-tools v1.57"; then
            echo "::error::cargo-build-sbf is not on platform-tools v1.57, the SBF compiler this job pins"
            exit 1
          fi

      # The tests load this artifact and fail (never skip) when it is missing.
      - name: Build the program (SBF v1)
        working-directory: solana
        run: |
          # The arch flag's spelling depends on the cargo-build-sbf build, and
          # an unknown value fails the step before compiling. Take the name
          # from the binary's accepted set instead of hard-coding one.
          CB="$HOME/.cargo/bin/cargo-build-sbf"
          if "$CB" --help | grep -qw sbfv1; then arch=sbfv1; else arch=v1; fi
          echo "SBF arch: $arch"
          "$CB" --arch "$arch" --tools-version v1.57 \
            --manifest-path programs/flashbolt_solana/Cargo.toml \
            --sbf-out-dir target/deploy
          # cargo-build-sbf writes a throwaway keypair when none exists. The
          # retained deployment keypair is deliberately not in the repo, so the
          # generated one can only be random — and comparing it with the pinned
          # program ID would (rightly) block the preflight. Remove it so CI runs
          # in its intended "no keypair" state instead of shipping a key that
          # would deploy this program somewhere else.
          rm -f target/deploy/flashbolt_solana-keypair.json

      # The conformance tests prove the IDL's *content*; this proves the file
      # was regenerated in the same commit, so it cannot lag the source.
      - name: Regenerate the IDL and fail on drift
        working-directory: solana
        run: |
          anchor idl build -o /tmp/flashbolt_solana.json
          diff -u idl/flashbolt_solana.json /tmp/flashbolt_solana.json

      # `-D warnings` is the gate. The two allows are not ours: anchor-lang
      # 0.31.1's `#[program]` / `#[derive(Accounts)]` expansion emits a call to
      # the deprecated `AccountInfo::realloc` and `cfg` conditions (`anchor-debug`,
      # `custom-heap`, `custom-panic`, `solana`) that check-cfg does not know, so
      # a bare `-D warnings` fails on anchor's generated code, not on this
      # program. Every other lint, including the `unused doc comment` this gate
      # found on `declare_id!`, still fails the build.
      - name: Clippy (program crate, warnings are errors)
        working-directory: solana
        run: |
          cargo clippy -p flashbolt_solana --all-targets --locked -- \
            -D warnings -A deprecated -A unexpected_cfgs

      - name: Tests (LiteSVM + IDL conformance)
        working-directory: solana
        run: cargo test -p flashbolt-config-tests --locked

      # Fail-closed on every source/IDL/toolchain gate. CI mode relaxes only
      # the two things a runner cannot have — a program keypair and a funded
      # devnet deployer — never the address, IDL or toolchain checks.
      - name: Preflight (CI mode, read-only)
        run: bash scripts/solana-program-preflight.sh
        env:
          FLASHBOLT_PREFLIGHT_CI: "1"

  deploy-convex:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The deploy key lives in the `CONVEX_DEPLOY_KEY` ENVIRONMENT (Settings →
    # Environments). A job only sees an environment's secrets when it declares
    # that environment, so without this line `secrets.CONVEX_DEPLOY_KEY`
    # resolves to an empty string and the deploy below is skipped while the job
    # still reports success.
    environment: CONVEX_DEPLOY_KEY
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check deploy key
        id: key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -n "$CONVEX_DEPLOY_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CONVEX_DEPLOY_KEY secret not configured - skipping backend deploy"
          fi

      - name: Deploy Convex functions
        if: steps.key.outputs.present == 'true'
        run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
