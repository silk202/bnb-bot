# One push updates every surface concurrently:
#   1. This workflow verifies the whole app (typecheck, tests, production
#      build — which rebuilds the overlay artifacts) and uploads the overlay
#      zips/userscript as a downloadable artifact.
#   2. The Convex backend deploys automatically from the production deploy key
#      on the CONVEX_DEPLOY_KEY environment (Settings → Environments →
#      CONVEX_DEPLOY_KEY → Secrets, stored as PROD_KEY, or as the older
#      CONVEX_DEPLOY_KEY name — both are read), which the `deploy-convex` job
#      declares as its environment. That job resolves the key's target with a
#      dry run first and refuses to deploy anywhere but the production
#      deployment.
#   3. The `solana-program` job builds the Anchor program (Solana SBF), proves
#      the tracked IDL still matches the source, runs clippy and the LiteSVM +
#      IDL conformance tests. It never deploys and never needs a keypair.
#   4. The `task-guard` job runs `bun run check:tasks` (the 4 migration + 3
#      deployment checks) against the real dev/prod deployments, so the guard
#      proves something on every push instead of only when a human remembers.
#   5. Vercel / Netlify / Cloudflare Pages / Render each auto-build from the
#      same push via their native git integration — their zero-config build
#      settings live in vercel.json / netlify.toml / wrangler.toml /
#      render.yaml (all run `bun run build`, which includes the overlay
#      rebuild). No workflow needed for those; connect the repo once.
#
# NOTE: `bun run lint` is run as a NON-BLOCKING step below (continue-on-error)
# because the repo carries pre-existing lint findings; typecheck + tests are
# the hard gates.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The task guard's own comment (and DEPLOYMENT.md) promise a manual dispatch;
  # without this key that promise was false. `deploy-convex` is push-only, so a
  # dispatch never deploys a backend. `guard_only` exists because the full run
  # spends 45 minutes on the Solana job, which proves nothing when what changed
  # is a deploy key or a secret layout.
  workflow_dispatch:
    inputs:
      guard_only:
        description: "Run only the task guard (skip verify, the app build and the Solana job)"
        type: boolean
        default: false
  # A nightly guard run: the timestamped verdict ring (reports/task-guard/) only
  # grows when the guard runs, so waiting for a push means a provider serving
  # regression can sit unnoticed for days. 06:17 UTC — off the hour, so the
  # scheduled run is not queued behind every other cron that fires at :00.
  schedule:
    - cron: "17 6 * * *"

concurrency:
  # The nightly run gets its own group: a push that is mid-Solana must not be
  # cancelled by a cron, and a slow cron must not be cancelled by a push.
  # Measured: run 45407872141 was cancelled exactly that way by the next push.
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'change' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The nightly run and a `guard_only` dispatch exist to re-prove the guard and
    # its key wiring, so they skip the app build entirely.
    if: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.guard_only) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (non-blocking — pre-existing findings)
        run: bun run lint
        continue-on-error: true

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # A build with no VITE_CONVEX_URL compiles, passes tests, and then ships a
      # "Backend not configured" screen with overlay artifacts that cannot gate
      # (no .convex.site stamp). Green must not mean that, so the value is
      # asserted before the build and the built artifacts are checked after it —
      # the same two facts `check:tasks` proves for the committed artifacts.
      - name: Assert the build target is configured
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          EXPECTED_SLUG: ${{ vars.CONVEX_PROD_SLUG || 'flexible-frog-776' }}
        run: |
          if [ -z "$VITE_CONVEX_URL" ]; then
            echo "::error::VITE_CONVEX_URL repository variable is not set, so this build would publish the 'Backend not configured' screen and unstamped overlay artifacts. Set Settings → Secrets and variables → Actions → Variables → VITE_CONVEX_URL to the production deployment's https://<deployment>.convex.cloud URL."
            exit 1
          fi
          ORIGIN="${VITE_CONVEX_URL%/}"
          case "$ORIGIN" in
            https://*.convex.cloud) ;;
            *)
              echo "::error::VITE_CONVEX_URL='$ORIGIN' is not a https://<deployment>.convex.cloud URL — src/lib/convex-url.ts rejects it, so the app would fall back to the unconfigured screen."
              exit 1
              ;;
          esac
          # The frontend target and the deploy target are independent settings:
          # `deploy-convex` proves the key names EXPECTED_SLUG, this proves the
          # UI is built for that same deployment. A mismatch would deploy the
          # backend to one deployment while shipping a UI wired to another, and
          # nothing else in CI would notice.
          SLUG="${ORIGIN#https://}"; SLUG="${SLUG%.convex.cloud}"
          if [ "$SLUG" != "$EXPECTED_SLUG" ]; then
            echo "::error::VITE_CONVEX_URL names '$SLUG', but production is '$EXPECTED_SLUG' (CONVEX_PROD_SLUG). The UI would be built for one deployment while deploy-convex deploys the other. Set the variable to https://$EXPECTED_SLUG.convex.cloud (or set CONVEX_PROD_SLUG if production really moved)."
            exit 1
          fi
          echo "build target: $ORIGIN (overlay gate origin ${ORIGIN%.convex.cloud}.convex.site), agrees with CONVEX_PROD_SLUG=$EXPECTED_SLUG"

      # `bun run build` = tsc -b && bun run overlay && vite build — the
      # overlay artifacts (extension zips + userscript served by the app's
      # Downloads page) are rebuilt from the same version consts on every
      # push, so they can never drift from the app.
      - name: Production build
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

      - name: Assert the built overlay artifacts carry the build target
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          want="${VITE_CONVEX_URL%/}"; want="${want%.convex.cloud}.convex.site"
          files="$(grep -rhoE 'https://[a-z0-9-]+\.convex\.site' public/overlay --exclude='*.zip' 2>/dev/null | sort -u)"
          zips="$(for z in public/overlay/*.zip; do unzip -p "$z" 2>/dev/null | grep -oE 'https://[a-z0-9-]+\.convex\.site'; done | sort -u)"
          if [ "$files" = "$want" ] && [ "$zips" = "$want" ]; then
            echo "overlay artifacts stamped $want (files + zips)"
          else
            echo "::error::overlay artifacts are not stamped with $want — files: '${files:-none}', zips: '${zips:-none}'. The uploaded downloads would ship without the daily-target gate."
            exit 1
          fi

      - name: Upload overlay artifacts (downloads surface)
        uses: actions/upload-artifact@v4
        with:
          name: overlay-${{ github.sha }}
          path: |
            public/overlay/*.zip
            public/overlay/*.user.js
          if-no-files-found: error
          retention-days: 30

  # The on-chain program is a separate toolchain (Rust + Solana SBF + Anchor)
  # and a separate failure domain, so it gets its own job: an app regression
  # must not hide a program regression, or the other way round.
  #
  # Pinned deliberately:
  #   * Solana CLI from the `stable` channel — the `v4.4.1` tag currently
  #     installs an SBF v1 toolchain whose bundled Cargo is 1.79, which cannot
  #     parse the `edition2024` manifests in the current dependency tree
  #     (`failed to parse manifest ... cpufeatures-0.3.1`). The channel build
  #     ships cargo-build-sbf 4.5.0.
  #   * platform-tools v1.57 (Rust 1.95) — pinned on its own, so the SBF
  #     compiler cannot drift with the channel.
  #   * cargo-build-sbf 4.5.0 from crates.io, pinned to the exact version. An
  #     unpinned `cargo install cargo-build-sbf` takes whatever is newest, and
  #     4.6.0 defaults to platform-tools v1.58 — a silent compiler move under a
  #     job that still pins v1.57.
  #   * The SBF v1 arch is required because LiteSVM 0.7 rejects the Agave
  #     default (v3) with `Instruction(InvalidAccountData)`. Its spelling is
  #     not stable across cargo-build-sbf builds (`sbfv1` on the runner,
  #     `v1` on the channel build used locally), so the build step reads the
  #     accepted name from the binary's own help output. Dropping this pin is
  #     a dependency migration, not a flag flip: SBPFv3 needs litesvm >= 0.18
  #     (solana-* 4.x, MSRV 1.97.1), while the harness is anchor-lang 0.31.1 /
  #     solana-sdk 2.2 / litesvm 0.7. Tracked as its own round.
  #   * Anchor 0.31.1 — matches anchor-lang in the program's Cargo.toml. Its
  #     prebuilt binary needs GLIBC >= 2.38, which is why this job runs on
  #     ubuntu-24.04 rather than relying on `ubuntu-latest`.
  #
  # Nothing here signs or deploys: the program keypair and a funded devnet
  # deployer do not exist on a runner, which is exactly what the preflight's
  # CI mode treats as expected rather than as a failure.
  solana-program:
    name: Solana program (build, IDL, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Same reason as `verify`: nightly and `guard_only` runs prove the guard, not
    # the program, and this job is the expensive half of the workflow.
    if: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.guard_only) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and the SBF build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            solana/target
          key: solana-${{ runner.os }}-sbf-v1.57-${{ hashFiles('solana/Cargo.lock') }}

      - name: Install Rust stable with clippy
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Install Solana CLI (stable channel)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # The wrapper bundled with the CLI only carries the SBF v1 sysroot for
      # its own platform-tools default (Cargo 1.79), which cannot parse the
      # edition2024 manifests in today's dependency tree. Its warning says to
      # install the current wrapper; that wrapper is built against Rust 1.95
      # and matches platform-tools v1.57, which is installed next and pinned
      # for the build.
      - name: Prefer the crates.io cargo-build-sbf over the CLI's copy
        # The crate's build script refuses to install while the CLI's copy
        # shadows it on PATH; GITHUB_PATH entries are prepended, so this makes
        # ~/.cargo/bin win for every later step.
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Exact version, not "newest": `cargo install cargo-build-sbf` without
      # --version installs 4.6.0+, whose DEFAULT_PLATFORM_TOOLS_VERSION is v1.58.
      # That is how this job went red: the compiler moved to v1.58 while the job
      # below still pinned v1.57. The crate source is the ground truth —
      # cargo-build-sbf 4.5.0/src/toolchain.rs declares
      # DEFAULT_PLATFORM_TOOLS_VERSION = "v1.57"; 4.6.0 declares v1.58.
      - name: Install cargo-build-sbf 4.5.0 (default platform-tools v1.57)
        run: cargo install cargo-build-sbf --version 4.5.0 --locked

      - name: Install SBF platform-tools v1.57
        # cargo-build-sbf resolves the release through the GitHub API, which
        # rate-limits runner IPs and failed with "Failed to parse Github
        # response: error decoding response body" on every retry. The release
        # asset is public and the version is pinned, so fetch that directly
        # into the cache layout the wrapper reads. A warm cache (see the cache
        # step above) skips this entirely.
        run: |
          TOOLS="$HOME/.cache/solana/v1.57/platform-tools"
          if [ -f "$TOOLS/version.md" ]; then
            echo "platform-tools v1.57 already cached"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/anza-xyz/platform-tools/releases/download/v1.57/platform-tools-linux-x86_64.tar.bz2" \
            -o /tmp/platform-tools.tar.bz2
          rm -rf /tmp/pt && mkdir -p /tmp/pt
          tar -xjf /tmp/platform-tools.tar.bz2 -C /tmp/pt
          # The archive root may or may not be wrapped in a directory; find the
          # one holding version.md and install its contents at the expected path.
          SRC="$(dirname "$(find /tmp/pt -name version.md -print -quit)")"
          test -f "$SRC/version.md" || { echo "platform-tools archive has no version.md"; exit 1; }
          mkdir -p "$TOOLS"
          cp -a "$SRC/." "$TOOLS/"
          test -f "$TOOLS/version.md"

      - name: Install Anchor CLI 0.31.1
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --locked --force
          avm install 0.31.1
          avm use 0.31.1
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      # A channel swap once put the SBF compiler on a platform-tools whose
      # Cargo 1.79 cannot parse the edition2024 manifests in today's dependency
      # tree. Printing the versions made that a 20-minute failure inside the
      # build; the pinned versions are asserted here instead, at the top.
      - name: Assert the pinned toolchain
        # Two facts, both about what the build actually uses: the crate version
        # that was installed, and the platform-tools directory the build step
        # names with --tools-version. The binary's own default is checked too, so
        # a crate bump that moves the default fails here by name instead of
        # twenty minutes later inside the compile.
        run: |
          PINNED_CRATE=4.5.0
          PINNED_TOOLS=v1.57
          TOOLS_DIR="$HOME/.cache/solana/$PINNED_TOOLS/platform-tools"
          TOOLS_MD="$TOOLS_DIR/version.md"

          rustc --version && cargo --version
          OUT="$("$HOME/.cargo/bin/cargo-build-sbf" --version)"
          echo "$OUT"
          which cargo-build-sbf && cargo-build-sbf --version | head -1
          solana --version && anchor --version

          if [ "$(command -v cargo-build-sbf)" != "$HOME/.cargo/bin/cargo-build-sbf" ]; then
            echo "::error::cargo-build-sbf on PATH is not the crates.io build in ~/.cargo/bin"
            exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -qF "$PINNED_CRATE"; then
            echo "::error::cargo-build-sbf is not the pinned crates.io $PINNED_CRATE build (an unpinned install drifts to a newer default platform-tools)"
            exit 1
          fi
          # The banner's exact wording, measured from 4.5.0: "Default
          # platform-tools: v1.57". The previous assertion matched
          # "platform-tools v1.57" — without the colon — so it could not match
          # any output and its red never proved the drift it claimed. (It also
          # mentions the newest release on GitHub, which is not what the build
          # uses; --tools-version decides that, checked below.)
          if ! printf '%s\n' "$OUT" | grep -qF "Default platform-tools: $PINNED_TOOLS"; then
            echo "::error::cargo-build-sbf $PINNED_CRATE declares a platform-tools default other than $PINNED_TOOLS — the pin and this assertion disagree"
            exit 1
          fi
          # version.md is NOT a version string — measured on a real v1.57
          # install it is a manifest of the exact rust/cargo/newlib revisions:
          #   <40-hex sha>  https://github.com/anza-xyz/rust.git
          #   <40-hex sha>  https://github.com/anza-xyz/cargo.git
          #   <40-hex sha>  https://github.com/anza-xyz/newlib.git
          # The version is carried by the directory name (which the wrapper
          # derives from the version) and by the banner's default above.
          if [ ! -f "$TOOLS_MD" ]; then
            echo "::error::platform-tools $PINNED_TOOLS is not installed at $TOOLS_DIR (the build passes --tools-version $PINNED_TOOLS)"
            exit 1
          fi
          head -3 "$TOOLS_MD"
          revisions="$(grep -cE '^[0-9a-f]{40}[[:space:]]+https://' "$TOOLS_MD" || true)"
          if [ "${revisions:-0}" -lt 3 ]; then
            echo "::error::$TOOLS_MD lists ${revisions:-0} pinned revision(s) — the $PINNED_TOOLS platform-tools install is incomplete"
            exit 1
          fi
          echo "platform-tools $PINNED_TOOLS present at $TOOLS_DIR with $revisions pinned revisions"
          # The wrapper reads this exact rustc (toolchain.rs: rust/bin/rustc) to
          # decide the toolchain it compiles with, and the banner above states
          # the Rust version it expects for this platform-tools. Comparing them
          # proves the installed tree is the one the pin describes.
          RUSTC_BIN="$TOOLS_DIR/rust/bin/rustc"
          if [ ! -x "$RUSTC_BIN" ]; then
            echo "::error::$RUSTC_BIN is missing — the $PINNED_TOOLS toolchain has no rust compiler"
            exit 1
          fi
          RUSTC_OUT="$("$RUSTC_BIN" --version)"
          echo "$RUSTC_OUT"
          BANNER_RUST="$(printf '%s\n' "$OUT" | sed -n 's/^Default Rust: //p')"
          case "$RUSTC_OUT" in
            rustc\ "$BANNER_RUST"*) ;;
            *) echo "::error::the $PINNED_TOOLS toolchain reports '$RUSTC_OUT' but cargo-build-sbf expects Rust '${BANNER_RUST:-unknown}' for it"; exit 1 ;;
          esac

      # The tests load this artifact and fail (never skip) when it is missing.
      - name: Build the program (SBF v1)
        working-directory: solana
        run: |
          # The arch flag's spelling depends on the cargo-build-sbf build, and
          # an unknown value fails the step before compiling. Take the name
          # from the binary's accepted set instead of hard-coding one.
          CB="$HOME/.cargo/bin/cargo-build-sbf"
          if "$CB" --help | grep -qw sbfv1; then arch=sbfv1; else arch=v1; fi
          echo "SBF arch: $arch"
          "$CB" --arch "$arch" --tools-version v1.57 \
            --manifest-path programs/flashbolt_solana/Cargo.toml \
            --sbf-out-dir target/deploy
          # cargo-build-sbf writes a throwaway keypair when none exists. The
          # retained deployment keypair is deliberately not in the repo, so the
          # generated one can only be random — and comparing it with the pinned
          # program ID would (rightly) block the preflight. Remove it so CI runs
          # in its intended "no keypair" state instead of shipping a key that
          # would deploy this program somewhere else.
          rm -f target/deploy/flashbolt_solana-keypair.json

      # The conformance tests prove the IDL's *content*; this proves the file
      # was regenerated in the same commit, so it cannot lag the source.
      - name: Regenerate the IDL and fail on drift
        working-directory: solana
        run: |
          anchor idl build -o /tmp/flashbolt_solana.json
          diff -u idl/flashbolt_solana.json /tmp/flashbolt_solana.json

      # `-D warnings` is the gate. The two allows are not ours: anchor-lang
      # 0.31.1's `#[program]` / `#[derive(Accounts)]` expansion emits a call to
      # the deprecated `AccountInfo::realloc` and `cfg` conditions (`anchor-debug`,
      # `custom-heap`, `custom-panic`, `solana`) that check-cfg does not know, so
      # a bare `-D warnings` fails on anchor's generated code, not on this
      # program. Every other lint, including the `unused doc comment` this gate
      # found on `declare_id!`, still fails the build.
      - name: Clippy (program crate, warnings are errors)
        working-directory: solana
        run: |
          cargo clippy -p flashbolt_solana --all-targets --locked -- \
            -D warnings -A deprecated -A unexpected_cfgs

      - name: Tests (LiteSVM + IDL conformance)
        working-directory: solana
        run: cargo test -p flashbolt-config-tests --locked

      # Fail-closed on every source/IDL/toolchain gate. CI mode relaxes only
      # the two things a runner cannot have — a program keypair and a funded
      # devnet deployer — never the address, IDL or toolchain checks.
      - name: Preflight (CI mode, read-only)
        run: bash scripts/solana-program-preflight.sh
        env:
          FLASHBOLT_PREFLIGHT_CI: "1"

  deploy-convex:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The deploy key lives in the `CONVEX_DEPLOY_KEY` ENVIRONMENT (Settings →
    # Environments). A job only sees an environment's secrets when it declares
    # that environment, so without this line `secrets.CONVEX_DEPLOY_KEY`
    # resolves to an empty string and the deploy below is skipped.
    environment: CONVEX_DEPLOY_KEY
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Green has to mean "deployed to the production deployment". Two ways
      # that used to be untrue: an absent secret turned this job green with a
      # notice, and `convex deploy` targets whatever deployment the key names —
      # a key generated on another deployment deploys this code there silently.
      # `--dry-run` resolves the key and prints the target without uploading
      # anything, so the target is asserted before the real deploy. Measured on
      # 2026-11-24: the environment key targets flexible-frog-776 (production).
      # If production ever moves, set the CONVEX_PROD_SLUG repository variable
      # rather than deleting this check.
      - name: Assert the deploy key targets production
        id: key
        env:
          # Measured 2026-11-24: the environment holds the production key as
          # PROD_KEY (the guard's check 2 proves it targets flexible-frog-776);
          # the older dedicated name is still accepted when it exists.
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY || secrets.PROD_KEY }}
          EXPECTED_SLUG: ${{ vars.CONVEX_PROD_SLUG || 'flexible-frog-776' }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::No production deploy key on the CONVEX_DEPLOY_KEY environment, so no backend was deployed. Add the production deployment's deploy key (dashboard → that deployment → Settings → Deploy keys) as PROD_KEY (or CONVEX_DEPLOY_KEY) at Settings → Environments → CONVEX_DEPLOY_KEY → Secrets."
            exit 1
          fi
          set +e
          OUT="$(bunx convex deploy --dry-run 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::convex rejected CONVEX_DEPLOY_KEY before deploying (exit $rc, see above) — regenerate it on the production deployment"
            exit 1
          fi
          TARGET="$(printf '%s\n' "$OUT" | grep -oE 'https://[a-z0-9-]+\.convex\.cloud' | head -1)"
          SLUG="${TARGET#https://}"; SLUG="${SLUG%.convex.cloud}"
          if [ -z "$SLUG" ]; then
            echo "::error::could not resolve a target deployment from CONVEX_DEPLOY_KEY — refusing to deploy blind"
            exit 1
          fi
          echo "target=$SLUG" >> "$GITHUB_OUTPUT"
          if [ "$SLUG" != "$EXPECTED_SLUG" ]; then
            echo "::error::CONVEX_DEPLOY_KEY targets '$SLUG', but production is '$EXPECTED_SLUG'. Nothing was deployed. Put the $EXPECTED_SLUG deploy key in the environment secret (or set the CONVEX_PROD_SLUG repository variable if production really moved)."
            exit 1
          fi
          echo "CONVEX_DEPLOY_KEY targets $SLUG (production) — deploying"

      - name: Deploy Convex functions
        run: |
          bunx convex deploy
          echo "deployed to ${{ steps.key.outputs.target }} (production)" >> "$GITHUB_STEP_SUMMARY"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY || secrets.PROD_KEY }}

  # The operator guard (`bun run check:tasks`) is the only thing that proves the
  # four migration tasks and the three deployment surfaces are intact, and until
  # now it only ran by hand. It runs here after the gates.
  #
  # It reads .env.local, which is untracked and never exists on a runner: the two
  # deploy keys arrive as secrets and check 1 (the developer machine's build
  # target) is skipped, so the run log says skipped rather than inventing a file.
  #
  # Exit codes are kept apart on purpose: 1 = a check failed (red), 2 = nothing
  # failed but the provider blocked a check (surfaced, not red), 0 = proved.
  task-guard:
    name: Task guard (migration + deployment checks)
    needs: verify
    # Push to main, nightly, or a dispatch. `needs: verify` alone would skip this
    # job whenever verify is skipped (nightly, guard_only), so verify's result is
    # read explicitly: a red verify still blocks the guard (that failure is the
    # finding), a skipped verify does not.
    if: ${{ always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The dev/prod deploy keys live on the CONVEX_DEPLOY_KEY environment as
    # DEV_KEY / PROD_KEY (measured 2026-11-24). A job only sees an environment's
    # secrets when it declares that environment, so without this line the guard
    # read two empty strings and failed with "missing secret(s)" every push.
    # Repository-level CONVEX_DEPLOY_KEY_1 / _2 still work and take precedence.
    environment: CONVEX_DEPLOY_KEY
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The guard's ring, baseline ledger and --json verdict are shell + python
      # only, so they are proved here before the live run spends the deployment
      # calls. Every regression this catches was silent (half the ledger rows
      # missing, skipped checks counted as zero), which is why it runs on the
      # runner and not only on a developer machine.
      - name: Task guard self-test (network-free)
        run: bun run check:guard

      - name: Task guard (4 migration + 3 deployment checks)
        id: guard
        env:
          # Repo-level names first (the documented layout), then the environment
          # names that exist today. Either pair works; neither is copied here.
          CONVEX_DEPLOY_KEY_1: ${{ secrets.CONVEX_DEPLOY_KEY_1 || secrets.DEV_KEY }}
          CONVEX_DEPLOY_KEY_2: ${{ secrets.CONVEX_DEPLOY_KEY_2 || secrets.PROD_KEY }}
          TASK_REPORT: reports/task-guard-latest.txt
          SKIP_BUILD_TARGET: "1"
        run: |
          # A guard that cannot run must not look like a guard that passed.
          missing=""
          [ -n "$CONVEX_DEPLOY_KEY_1" ] || missing="$missing CONVEX_DEPLOY_KEY_1"
          [ -n "$CONVEX_DEPLOY_KEY_2" ] || missing="$missing CONVEX_DEPLOY_KEY_2"
          if [ -n "$missing" ]; then
            echo "::error::task guard did not run: missing secret(s):$missing. Set them as repository secrets (Settings → Secrets and variables → Actions) or as DEV_KEY / PROD_KEY on the CONVEX_DEPLOY_KEY environment this job declares — then re-run."
            exit 1
          fi
          # The key's own `dev:<deployment>|…` prefix names its target, so the log
          # states which deployments these secrets address before any check runs
          # (never the value). A swap is caught here and again in check 2.
          slug_of() { local h="${1%%|*}"; case "$h" in *:*) printf %s "${h##*:}" ;; *) printf %s "" ;; esac; }
          echo "guard keys: dev -> $(slug_of "$CONVEX_DEPLOY_KEY_1" || true) (expected pastel-pelican-634), prod -> $(slug_of "$CONVEX_DEPLOY_KEY_2" || true) (expected flexible-frog-776)"
          set +e
          bun run check:tasks
          rc=$?
          set -e
          echo "guard exit=$rc"
          case "$rc" in
            0)
              echo "result=passed" >> "$GITHUB_OUTPUT"
              ;;
            2)
              # Nothing was proved false: the provider disabled function serving
              # or answered with a bare infrastructure error. Reported loudly,
              # but not turned into a red build that would hide the real verdict.
              echo "result=blocked" >> "$GITHUB_OUTPUT"
              echo "::error::task guard: no check failed, but at least one is BLOCKED by the provider (exit 2) — see reports/task-guard-latest.txt; re-run once serving is back"
              ;;
            *)
              echo "result=failed" >> "$GITHUB_OUTPUT"
              echo "::error::task guard failed (exit $rc) — see reports/task-guard-latest.txt"
              exit "$rc"
              ;;
          esac

      - name: Upload the guard's run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-guard-${{ github.sha }}
          # `.json` as well: `check:tasks --json` writes its verdict (and its
          # ring entry) as JSON, and an upload that only globbed `*.txt` would
          # silently drop the run that was meant to be machine-readable.
          path: |
            reports/task-guard-latest.txt
            reports/task-guard-latest.json
            reports/task-guard/*.txt
            reports/task-guard/*.json
          if-no-files-found: warn
          retention-days: 30

